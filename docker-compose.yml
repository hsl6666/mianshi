services:
  backend:
    build:
      context: ./backend
    container_name: mianshi-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite:///./data/app.db
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://127.0.0.1}
      FEISHU_BID_NOTIFY_WEBHOOK_URL: ${FEISHU_BID_NOTIFY_WEBHOOK_URL:-}
      FEISHU_BID_NOTIFY_SECRET: ${FEISHU_BID_NOTIFY_SECRET:-}
      FEISHU_BID_NOTIFY_AT_USER_ID: ${FEISHU_BID_NOTIFY_AT_USER_ID:-}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend/data:/app/data

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
    container_name: mianshi-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:20838:80"
    depends_on:
      - backend
